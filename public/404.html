<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/lil-portfolio/favicon.svg" />
    <title>Page not found | Elizabeth (Lil) Lloyd-Jones</title>

    <script>
      // GitHub Pages SPA redirect (rafgraph/spa-github-pages pattern).
      // GH Pages serves this file for any unknown path, e.g. /lil-portfolio/development.
      // We rewrite that path into a query string on the real index.html, which
      // main.tsx's redirect script below decodes back into the real route,
      // so React Router still resolves it correctly instead of losing the route.
      var pathSegmentsToKeep = 1; // keeps "/lil-portfolio"
      var l = window.location;
      var path = l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/");
      var rest = l.pathname.slice(path.length);

      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          path +
          "/?redirect=" +
          encodeURIComponent(rest.replace(/&/g, "~and~")) +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    />

    <style>
      /* Static passthrough page — not run through Tailwind, so the
         theme's oklch values are hardcoded here directly to match. */
      :root {
        --background: oklch(0.21 0.04 250);
        --foreground: oklch(0.95 0.02 170);
        --muted-foreground: oklch(0.75 0.05 165);
        --primary: oklch(0.75 0.18 165);
        --primary-foreground: oklch(0.21 0.04 250);
        --border: oklch(0.75 0.18 165 / 20%);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        background: var(--background);
        color: var(--foreground);
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }

      .wrap {
        max-width: 32rem;
      }

      .code {
        font-family: "Syne", ui-sans-serif, system-ui, sans-serif;
        font-weight: 800;
        font-size: clamp(4rem, 12vw, 7rem);
        line-height: 1;
        margin: 0;
        color: var(--primary);
      }

      h1 {
        font-family: "Syne", ui-sans-serif, system-ui, sans-serif;
        font-weight: 700;
        font-size: clamp(1.25rem, 4vw, 1.75rem);
        margin: 0.75rem 0 0.5rem;
      }

      p {
        color: var(--muted-foreground);
        font-size: 1rem;
        line-height: 1.5;
        margin: 0 0 1.75rem;
      }

      a.button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        background: var(--primary);
        color: var(--primary-foreground);
        font-weight: 600;
        text-decoration: none;
        transition: opacity 0.15s ease;
      }

      a.button:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or may have moved.</p>
      <a class="button" href="/lil-portfolio/">Back to the portfolio</a>
    </div>
  </body>
</html>
