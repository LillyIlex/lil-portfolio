    <style>
      /* Inline to load before the JS bundle arrives. */
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 0 1.5rem;
        background: #171c2b;
        background: oklch(0.21 0.04 250);
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #boot-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot-loader .bl-mark {
        font-family: "Syne", ui-sans-serif, system-ui, sans-serif;
        font-weight: 700;
        /* Scales from ~1.75rem on a small phone up to 4rem on desktop
           instead of a fixed 4rem that overflowed narrow screens. */
        font-size: clamp(1.75rem, 9vw, 4rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6ee7c2;
        color: oklch(0.75 0.18 165);
        text-align: center;
      }
      #boot-loader .bl-dots {
        display: flex;
        gap: 0.4rem;
      }
      #boot-loader .bl-dots span {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 999px;
        background: #6ee7c2;
        background: oklch(0.75 0.18 165);
        animation: bl-bounce 1.1s ease-in-out infinite;
      }
      #boot-loader .bl-dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      #boot-loader .bl-dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes bl-bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
          opacity: 0.5;
        }
        40% {
          transform: translateY(-0.4rem);
          opacity: 1;
        }
      }
      #boot-loader .bl-message {
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        /* Scales from ~1.1rem on a small phone up to 2rem on desktop, and
           wraps/centres instead of overflowing the viewport horizontally. */
        font-size: clamp(1.1rem, 4.5vw, 2rem);
        color: #d6ded9;
        color: oklch(0.95 0.02 170 / 80%);
        min-height: 1.4em;
        max-width: 90vw;
        text-align: center;
        word-break: break-word;
      }
      #boot-loader .bl-message::after {
        content: "_";
        margin-left: 2px;
        color: #6ee7c2;
        color: oklch(0.75 0.18 165);
        animation: bl-blink 1s step-end infinite;
      }
      @keyframes bl-blink {
        50% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader .bl-dots span,
        #boot-loader .bl-message::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get("redirect");
        if (redirect) {
          params.delete("redirect");
          var rest = params.toString();
          window.history.replaceState(
            null,
            "",
            window.location.pathname.slice(0, -1) +
              redirect.replace(/~and~/g, "&") +
              (rest ? "?" + rest : "") +
              window.location.hash,
          );
        }
      })();
    </script>
    <div id="boot-loader" role="status" aria-live="polite">
      <span class="bl-mark">LL-J</span>
      <div class="bl-dots"><span></span><span></span><span></span></div>
      <p class="bl-message" id="boot-loader-message">just building your experience</p>
    </div>

    <script>
      (function () {
        var messages = [
          "building suspense",
          "npm install patience",
          "compiling good vibes",
        ];
        var el = document.getElementById("boot-loader-message");
        var i = 0;
        var rotate = setInterval(function () {
          i = (i + 1) % messages.length;
          if (el) el.textContent = messages[i];
        }, 1400);

        var loader = document.getElementById("boot-loader");
        var hidden = false;
        function hideLoader() {
          if (hidden || !loader) return;
          hidden = true;
          clearInterval(rotate);
          loader.classList.add("is-hidden");
          setTimeout(function () {
            loader.remove();
          }, 600);
        }

        // Primary signal: React has mounted real content into #root.
        var root = document.getElementById("root");
        if (root && "MutationObserver" in window) {
          var observer = new MutationObserver(function () {
            if (root.childElementCount > 0) {
              observer.disconnect();
              hideLoader();
            }
          });
          observer.observe(root, { childList: true });
        }

        window.addEventListener("load", function () {
          setTimeout(hideLoader, 250);
        });
        setTimeout(hideLoader, 8000);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
