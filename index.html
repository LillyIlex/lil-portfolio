  <body>
    <script>
      // Other half of the 404.html redirect trick: turn ?redirect=/development
      // back into a real /lil-portfolio/development URL via history.replaceState,
      // before React Router reads the location, so it never sees the query string.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get("redirect");
        if (redirect) {
          params.delete("redirect");
          var rest = params.toString();
          window.history.replaceState(
            null,
            "",
            window.location.pathname.slice(0, -1) +
              redirect.replace(/~and~/g, "&") +
              (rest ? "?" + rest : "") +
              window.location.hash,
          );
        }
      })();
    </script>
    <!-- TEMPORARY DIAGNOSTIC: shows any JS error directly on the page.
         Remove this whole <script> block once the bug is found. -->
    <script>
      (function () {
        function showError(label, err) {
          var msg = (err && (err.stack || err.message)) || String(err);
          var box = document.getElementById("__diag_error");
          if (!box) {
            box = document.createElement("pre");
            box.id = "__diag_error";
            box.style.cssText =
              "position:fixed;inset:0;z-index:999999;margin:0;padding:16px;" +
              "background:#1a0000;color:#ff6b6b;font-size:13px;line-height:1.4;" +
              "white-space:pre-wrap;overflow:auto;font-family:monospace;";
            document.body.appendChild(box);
          }
          box.textContent += "[" + label + "] " + msg + "\n\n";
        }
        window.addEventListener("error", function (e) {
          showError("error", e.error || e.message);
        });
        window.addEventListener("unhandledrejection", function (e) {
          showError("promise", e.reason);
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
